[package]
name = "merman3"
edition.workspace = true
version.workspace = true

[[bin]]
name = "merman3"
path = "src/main.rs"

[dependencies]
merman3_core = { path = "../core" }
aargvark = "0.12"
serde_json = { version = "1", features = ["preserve_order"] }
htwrap = "0.15"
http = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
loga = "0.5"
open = "5"
